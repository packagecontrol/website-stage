name: Deploy package website

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: thecrawl branch, tag, or commit to deploy
        required: false
        default: gh-pages
  schedule:
    - cron: "22 8 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: package-website-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out website source
        uses: actions/checkout@v6
        with:
          repository: packagecontrol/thecrawl
          ref: ${{ inputs.source_ref || 'gh-pages' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Restore rendered README cache
        uses: actions/cache@v5
        with:
          path: readmes_rendered.json
          key: readmes-rendered-${{ github.run_id }}
          restore-keys: |
            readmes-rendered-

      - name: Build
        env:
          SITE_PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

