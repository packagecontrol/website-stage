name: Deploy package website

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: thecrawl branch, tag, or commit to deploy
        required: false
        default: gh-pages
  schedule:
    - cron: "22 8 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: package-website-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out website source
        uses: actions/checkout@v6
        with:
          repository: packagecontrol/thecrawl
          ref: ${{ inputs.source_ref || 'gh-pages' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore rendered README cache
        uses: actions/cache@v5
        with:
          path: readmes_rendered.json
          key: readmes-rendered-${{ github.run_id }}
          restore-keys: |
            readmes-rendered-

      - name: Build
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin == 'http://packages.sublimetext.io' && 'https://packages.sublimetext.io' || steps.pages.outputs.origin }}
          SITE_PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Add deployment marker
        id: marker
        run: |
          marker="$(date +%s%N | sha256sum | cut -d ' ' -f 1)"
          printf '%s\n' "$marker" > "_site/$marker"
          echo "value=$marker" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Wait for GitHub Pages propagation
        if: ${{ endsWith(steps.pages.outputs.origin, '://packages.sublimetext.io') }}
        env:
          MARKER: ${{ steps.marker.outputs.value }}
        run: |
          started=$SECONDS
          attempt=0

          # Target roughly 9-10 minutes, with waits capped at 32 seconds.
          for delay in 0 1 2 4 8 16 32 32 32 32 32 32 32 32 32 32 32 32 32 32 32 32 32; do
            sleep "$delay"
            elapsed=$((SECONDS - started))
            url="https://packages.sublimetext.io/${MARKER}?deployment-check=${GITHUB_RUN_ID}-${attempt}"

            if response="$(curl --fail --silent --show-error --max-time 10 "$url")" \
              && [[ "$response" == "$MARKER" ]]; then
              echo "::notice title=GitHub Pages propagation::New site ready ${elapsed} second(s) after deploy"
              exit 0
            fi

            echo "Deployment marker not ready after ${elapsed} seconds"
            attempt=$((attempt + 1))
          done

          elapsed=$((SECONDS - started))
          echo "::error title=GitHub Pages propagation::Deployment marker unavailable after ${elapsed} seconds; Cloudflare cache was not purged"
          exit 1

      - name: Purge volatile Cloudflare cache
        if: ${{ endsWith(steps.pages.outputs.origin, '://packages.sublimetext.io') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"tags":["package-site-volatile"]}'
